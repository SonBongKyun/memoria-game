name: MEMORIA Godot CI

on:
  push:
    branches: [main, "stabilization/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memoria-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    name: Validate and export Windows demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate repository contracts
        run: python3 scripts/validation/repo_contract.py

      - name: Setup Godot 4.6.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --editor --path . --quit-after 120

      - name: Export Windows demo
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop (Demo)" "build/MEMORIA-Demo-v0.1.0.exe"

      - name: Verify exported artifact
        run: |
          test -s build/MEMORIA-Demo-v0.1.0.exe
          test -s build/MEMORIA-Demo-v0.1.0.pck
          ls -lh build/MEMORIA-Demo-v0.1.0.exe build/MEMORIA-Demo-v0.1.0.pck

      - name: Upload Windows demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEMORIA-Demo-v0.1.0-Windows
          path: |
            build/MEMORIA-Demo-v0.1.0.exe
            build/MEMORIA-Demo-v0.1.0.pck
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub demo prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="demo-v0.1.0"
          TITLE="MEMORIA Demo v0.1.0"
          NOTES="Automated Windows demo build from ${GITHUB_SHA}. This is a prerelease build for playtesting, not the final Steam release."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              build/MEMORIA-Demo-v0.1.0.exe \
              build/MEMORIA-Demo-v0.1.0.pck \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              build/MEMORIA-Demo-v0.1.0.exe \
              build/MEMORIA-Demo-v0.1.0.pck \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi
